name: Feature request
description: Suggest a focused, testable improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Observable result
      description: Describe the behavior that should be verifiable on host or board.
    validations:
      required: true
